<section class="capability-area-map" aria-labelledby="capability-map-heading">

    <span class="eyebrow">Capability inventory</span>
    <h2 id="capability-map-heading">{{ page.capability_entries.size }} capabilities</h2>
  </div>
  <div class="card-grid">
    {% for entry in page.capability_entries %}

</section>
