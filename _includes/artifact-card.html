<a class="blueprint-card" href="{{ include.entry.url | relative_url }}">
  <span class="card-eyebrow">{{ include.entry.type_label }}</span>
  <h3>{{ include.entry.title }}</h3>
  <p class="summary">{{ include.entry.description }}</p>
  <div class="meta-row">
    <span class="badge badge-status is-{{ include.entry.status }}">{{ include.entry.status }}</span>
    <span class="badge badge-meta">v{{ include.entry.version }}</span>
  </div>
</a>
