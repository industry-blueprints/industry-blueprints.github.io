- id: asset
  title: Asset
  description: A physical item, facility, network component, land interest, vehicle, or other resource managed to support public service.
  typical_stewards: [asset manager, operational owner]
- id: asset-class
  title: Asset Class & Type
  description: Shared classifications used to organize comparable assets and apply appropriate standards.
  typical_stewards: [asset manager, engineering lead]
- id: location
  title: Location
  description: The physical, geographic, linear, or functional placement of an asset.
  typical_stewards: [GIS team, operational owner]
- id: condition
  title: Condition
  description: A current, dated assessment of physical state, defects, and remaining service potential.
  typical_stewards: [inspector, engineer]
- id: inspection
  title: Inspection
  description: The planned or event-driven observation that supports condition, compliance, and maintenance decisions.
  typical_stewards: [inspection program owner]
- id: work-order
  title: Work Order
  description: Authorized maintenance or field work, including scope, priority, schedule, resources, completion, and cost.
  typical_stewards: [maintenance planner]
- id: maintenance-history
  title: Maintenance History
  description: The accumulated record of preventive, corrective, and emergency work performed on an asset.
  typical_stewards: [maintenance manager]
- id: cost
  title: Cost
  description: Acquisition, operation, maintenance, renewal, disposal, and estimated lifecycle expenditures.
  typical_stewards: [finance team, asset manager]
- id: risk
  title: Risk & Criticality
  description: The importance of an asset and the service, safety, financial, environmental, or community consequence associated with its performance.
  typical_stewards: [service owner, risk owner]
- id: service-level
  title: Service Level
  description: The expected service result to which an asset or asset system contributes.
  typical_stewards: [program owner, executive sponsor]
- id: project-investment
  title: Project & Investment
  description: A proposed or approved change that creates, renews, replaces, improves, or retires assets.
  typical_stewards: [capital planning team, project owner]
