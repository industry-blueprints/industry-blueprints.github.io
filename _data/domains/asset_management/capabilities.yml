- id: asset-inventory-hierarchy
  title: Asset Inventory & Hierarchy Management
  description: Maintain a reliable view of assets, their identity, location, ownership, classification, and relationships.
  lifecycle_stages: [acquire-create, operate, dispose]
- id: inspection-condition
  title: Inspection & Condition Assessment
  description: Plan assessments and record consistent observations about condition, defects, and remaining life.
  lifecycle_stages: [inspect-monitor, maintain, renew-replace]
- id: work-maintenance
  title: Work & Maintenance Management
  description: Turn service needs and asset needs into planned, scheduled, completed, and recorded work.
  lifecycle_stages: [operate, maintain]
- id: service-level-management
  title: Service-Level Management
  description: Connect asset performance to the reliability, quality, accessibility, and capacity of public services.
  lifecycle_stages: [plan, operate, inspect-monitor]
- id: risk-criticality
  title: Risk & Criticality Analysis
  description: Understand which assets matter most and how condition or failure could affect service, safety, cost, and community outcomes.
  lifecycle_stages: [plan, inspect-monitor, maintain]
- id: lifecycle-planning
  title: Lifecycle Planning
  description: Compare maintenance, rehabilitation, replacement, and retirement choices across an asset's useful life.
  lifecycle_stages: [plan, maintain, renew-replace, dispose]
- id: capital-needs-forecasting
  title: Capital Needs Forecasting
  description: Estimate future renewal and improvement needs using inventory, condition, service, risk, cost, and timing information.
  lifecycle_stages: [plan, renew-replace]
- id: investment-prioritization
  title: Investment Prioritization
  description: Compare proposed investments using transparent service, risk, value, affordability, and readiness considerations.
  lifecycle_stages: [plan, renew-replace]
- id: performance-monitoring
  title: Performance Monitoring
  description: Track portfolio outcomes, service contribution, plan delivery, and information health over time.
  lifecycle_stages: [operate, inspect-monitor, maintain, renew-replace]
