scale_id: pscmf-five-level
dimensions:
  - id: inventory-information
    title: Asset inventory and information
    stage_ids: [information-data, governance-improvement]
    direction: From fragmented or uncertain records toward governed, connected information that is trusted for operational and investment decisions.
  - id: lifecycle-planning
    title: Lifecycle planning
    stage_ids: [business-capabilities, target-model-architecture, transformation-roadmap]
    direction: From short-term reactions toward coordinated lifecycle strategies linked to service, risk, cost, and delivery capacity.
  - id: investment-decisions
    title: Investment decisions
    stage_ids: [initiative-prioritization, governance-improvement]
    direction: From isolated proposals toward transparent portfolio choices with explicit criteria, evidence, accountability, and review.
  - id: performance-learning
    title: Performance and learning
    stage_ids: [performance-expectations, governance-improvement]
    direction: From activity reporting toward outcome-focused measures that inform regular decisions and improvement.
