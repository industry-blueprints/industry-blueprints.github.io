- id: mission-outcomes
  number: 1
  short_title: Mission & Outcomes
  title: Mission & Public Outcomes
  layer: mission-outcomes
  core_question: Why does this capability exist, and which public outcomes does it support?
  outputs: [vision, objectives, outcome-map, guiding-principles]
  ai_prompt:
    where: Where could AI materially improve a public outcome or service?
    when: When is AI appropriate given consequence, discretion, and available information?
    how: How can AI be used with clear human accountability?

- id: operating-context
  number: 2
  short_title: Operating Context
  title: Scope & Operating Context
  layer: mission-outcomes
  core_question: What is in scope, and what environment shapes the capability?
  outputs: [scope, stakeholder-map, policy-context]
  ai_prompt:
    where: Where does the operating context create a meaningful opportunity for assistance?
    when: When do policy, jurisdiction, access, or equity considerations affect suitability?
    how: How can the solution respect the capability's operating boundaries?

- id: services-value-streams
  number: 3
  short_title: Services & Value Streams
  title: Services & Value Streams
  layer: business-operating-model
  core_question: What services are provided, and how does value move from beginning to end?
  outputs: [service-catalogue, value-stream-map, lifecycle]
  ai_prompt:
    where: Where in the service or lifecycle is work information-intensive, repetitive, or difficult to coordinate?
    when: When would assistance improve the service without weakening access or accountability?
    how: How can AI fit into the end-to-end service rather than create an isolated step?

- id: performance-expectations
  number: 4
  short_title: Performance
  title: Performance & Service Expectations
  layer: performance-governance
  core_question: How is successful service and capability performance understood?
  outputs: [service-levels, key-performance-indicators, outcome-measures]
  ai_prompt:
    where: Where could analytics or AI improve measurement, forecasting, or early awareness?
    when: When are the measures sufficiently meaningful and reliable for AI-supported decisions?
    how: How will improvement be evaluated against service and public outcomes?

- id: risk-controls
  number: 5
  short_title: Risk & Controls
  title: Risk, Criticality & Controls
  layer: performance-governance
  core_question: What is most important to protect, and how are risks managed?
  outputs: [risk-model, control-catalogue, criticality-criteria]
  ai_prompt:
    where: Where could AI strengthen awareness, consistency, or control monitoring?
    when: When do consequence and uncertainty require greater human involvement or make AI unsuitable?
    how: How will controls, review, evidence, and escalation remain effective?

- id: business-capabilities
  number: 6
  short_title: Capabilities
  title: Business Capabilities
  layer: business-operating-model
  core_question: What does the organization need to be able to do well?
  outputs: [capability-model, capability-heat-map, capability-gaps]
  ai_prompt:
    where: Which capability areas contain work that AI could usefully support?
    when: When is AI relevant to a capability gap rather than a distraction from a more basic need?
    how: How does the AI use case strengthen the capability as a whole?

- id: processes-roles-decisions
  number: 7
  short_title: Work & Decisions
  title: Processes, Roles & Decisions
  layer: business-operating-model
  core_question: How is work carried out, how are decisions made, and who is accountable?
  outputs: [process-maps, decision-inventory, responsibility-model]
  ai_prompt:
    where: Where could AI reduce effort, improve consistency, or support a difficult decision?
    when: When does the decision require judgment, explanation, review, or direct human action?
    how: How are the human role, decision rights, handoffs, and override path made explicit?

- id: information-data
  number: 8
  short_title: Information & Data
  title: Information & Data
  layer: information-technology
  core_question: What information supports the work, and who stewards it?
  outputs: [information-model, data-requirements, ownership-matrix]
  ai_prompt:
    where: Which information could support useful retrieval, classification, prediction, or generation?
    when: When is the information sufficiently relevant, reliable, permissible, and representative?
    how: How will sources, quality, access, retention, and provenance be managed?

- id: applications-integration
  number: 9
  short_title: Applications
  title: Applications & Integration
  layer: information-technology
  core_question: Which systems support the capability, and how do they work together?
  outputs: [application-landscape, system-of-record-matrix, integration-map]
  ai_prompt:
    where: Where could AI improve an existing application experience or connect fragmented work?
    when: When can existing systems provide a dependable and maintainable foundation?
    how: How will AI services integrate without obscuring authoritative systems and records?

- id: analytics-ai
  number: 10
  short_title: Analytics & AI
  title: Analytics, Decision Support & AI
  layer: information-technology
  core_question: How can information, analytics, and AI improve work and decisions?
  outputs: [use-case-catalogue, decision-support-patterns, ai-opportunity-map]
  ai_prompt:
    where: Which use cases offer clear public or operational value?
    when: Which candidates are suitable after considering consequence, discretion, information, and readiness?
    how: Which pattern, human-involvement mode, controls, and measures fit each candidate?

- id: target-model-architecture
  number: 11
  short_title: Target Model
  title: Target Operating Model & Architecture
  layer: transformation
  core_question: What does the intended future capability and enabling environment look like?
  outputs: [target-operating-model, target-architecture, design-principles]
  ai_prompt:
    where: Where does AI belong in the target model, if it adds durable value?
    when: When is the organization ready to operate and govern the proposed AI capability?
    how: How will the target architecture support accountability, monitoring, change, and exit options?

- id: initiative-prioritization
  number: 12
  short_title: Priorities
  title: Initiative Prioritization
  layer: transformation
  core_question: Which changes provide the strongest combination of value, feasibility, readiness, and risk reduction?
  outputs: [initiative-catalogue, scoring-model, portfolio-recommendations]
  ai_prompt:
    where: Which AI-related initiatives compete with or depend on other modernization work?
    when: When does an AI initiative have enough value, readiness, and evidence to advance?
    how: How will AI initiatives be compared fairly with process, data, workforce, and platform investments?

- id: transformation-roadmap
  number: 13
  short_title: Roadmap
  title: Transformation Roadmap
  layer: transformation
  core_question: In what order can the changes be delivered and adopted?
  outputs: [dependencies, delivery-waves, modernization-roadmap]
  ai_prompt:
    where: Where do AI experiments, foundations, and scaled uses fit in the broader sequence?
    when: When are prerequisites such as information quality, controls, integration, and workforce readiness in place?
    how: How will learning from pilots influence later roadmap decisions?

- id: governance-improvement
  number: 14
  short_title: Governance
  title: Governance & Continuous Improvement
  layer: performance-governance
  core_question: How is the capability sustained, reviewed, and improved over time?
  outputs: [governance-model, review-cadence, performance-dashboard, improvement-backlog]
  ai_prompt:
    where: Where does ongoing AI monitoring inform operational and governance decisions?
    when: When is an AI use case adjusted, paused, retrained, or retired?
    how: How are accountability, evaluation, incident response, and improvement maintained throughout its life?
