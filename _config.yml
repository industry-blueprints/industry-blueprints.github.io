title: Public Sector Blueprints
tagline: Public-sector workloads, capabilities, and vendor-neutral solution architecture
description: A living solution design system for public-sector capabilities, workloads, and reusable technology patterns.
url: "https://industry-blueprints.github.io"
baseurl: ""
lang: en

author:
  name: Jeremy Hofmann
  site: "https://hofmann-studio.github.io"

repository:
  site: "https://github.com/industry-blueprints/industry-blueprints.github.io"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
permalink: pretty

collections:
  capabilities:
    output: true
    permalink: /capabilities/:name/
  workloads:
    output: true
    permalink: /workloads/:name/
  patterns:
    output: true
    permalink: /patterns/:name/
  architectures:
    output: true
    permalink: /architectures/:name/
  implementation_patterns:
    output: true
    permalink: /implementation-patterns/:name/
  tools:
    output: true
    permalink: /tools/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: capabilities
    values:
      layout: knowledge
      eyebrow: Capability
  - scope:
      path: ""
      type: workloads
    values:
      layout: knowledge
      eyebrow: Workload
  - scope:
      path: ""
      type: patterns
    values:
      layout: knowledge
      eyebrow: Solution Pattern
  - scope:
      path: ""
      type: architectures
    values:
      layout: knowledge
      eyebrow: Reference Architecture
  - scope:
      path: ""
      type: implementation_patterns
    values:
      layout: knowledge
      eyebrow: Implementation Pattern
  - scope:
      path: ""
      type: tools
    values:
      layout: knowledge
      eyebrow: Engagement tool

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .design

